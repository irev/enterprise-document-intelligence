asyncapi: 3.0.0
info:
  title: Enterprise Document Intelligence Events
  version: 0.4.0
  description: Logical event contract. Broker/protocol bindings are deployment-specific.
channels:
  documentEvents:
    address: document.events
    messages:
      documentEvent:
        $ref: '#/components/messages/DocumentEvent'
operations:
  publishDocumentLifecycle:
    action: send
    channel:
      $ref: '#/channels/documentEvents'
    messages:
      - $ref: '#/channels/documentEvents/messages/documentEvent'
components:
  messages:
    DocumentEvent:
      name: DocumentEvent
      payload:
        type: object
        required: [event_id, event_type, event_version, occurred_at, tenant_id, document_id, correlation_id, data]
        properties:
          event_id: { type: string }
          event_type:
            enum:
              - document.received
              - document.processing_started
              - document.classified
              - document.extracted
              - document.validated
              - document.review_requested
              - document.review_completed
              - document.processing_failed
              - document.completed
          event_version: { type: string }
          occurred_at: { type: string, format: date-time }
          tenant_id: { type: string }
          document_id: { type: string }
          correlation_id: { type: string }
          causation_id: { type: [string, "null"] }
          data: { type: object }
