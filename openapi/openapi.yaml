openapi: 3.1.0
info:
  title: Enterprise Document Intelligence API
  version: 0.3.0
  description: Vendor-neutral API contract for asynchronous enterprise document processing.
servers:
  - url: https://example.invalid
paths:
  /v1/documents:
    post:
      operationId: submitDocument
      summary: Submit a document for processing
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
        - in: header
          name: X-Correlation-Id
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, tenant_id]
              properties:
                file: { type: string, format: binary }
                tenant_id: { type: string }
                business_domain: { type: string }
                process: { type: string }
                document_profile: { type: string }
      responses:
        "202":
          description: Accepted for asynchronous processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /v1/documents/{document_id}:
    get:
      operationId: getDocument
      summary: Get document lifecycle status
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentStatus" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/documents/{document_id}/result:
    get:
      operationId: getDocumentResult
      summary: Get canonical processing result
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Canonical result
          content:
            application/json:
              schema:
                type: object
                description: Must conform to schemas/canonical/document-result.schema.json.
        "409":
          description: Result is not yet available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/documents/{document_id}/reviews:
    post:
      operationId: submitDocumentReview
      summary: Record a human review action
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Review recorded
        "409":
          description: Review/version conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    DocumentId:
      in: path
      name: document_id
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Request failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Submission:
      type: object
      required: [document_id, status]
      properties:
        document_id: { type: string }
        status: { const: RECEIVED }
        correlation_id: { type: string }
    DocumentStatus:
      type: object
      required: [document_id, status]
      properties:
        document_id: { type: string }
        status:
          enum: [RECEIVED, PROCESSING, REVIEW_REQUIRED, COMPLETED, FAILED, UNSUPPORTED]
        updated_at: { type: string, format: date-time }
    ReviewRequest:
      type: object
      required: [review_version, actions]
      properties:
        review_version: { type: integer, minimum: 0 }
        actions:
          type: array
          minItems: 1
          items:
            type: object
            required: [action]
            properties:
              action:
                enum: [CONFIRM, CORRECT, MARK_NOT_PRESENT, MARK_ILLEGIBLE, RECLASSIFY, ESCALATE]
              field: { type: [string, "null"] }
              value: {}
              reason: { type: [string, "null"] }
    Error:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlation_id: { type: string }
